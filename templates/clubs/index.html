{% extends 'layout.html' %}

{% block title %}
    {{title}}
{% endblock %}


{% block content %}
    <div class="container">
        <h1>{{title}}</h1>
        <hr>
        <div class="row">
            <div class="col"></div>
            <div class="col">
                <a href="{{url_for('new_club')}}" class="btn btn-outline-primary float-end">
                    <i class="bi bi-plus-square-fill"></i> Add New Club
                </a>
            </div>
        </div>
        <table class="table">
            <thead>
                <tr>
                <th scope="col">#</th>
                <th scope="col">Club Name</th>
                <th scope="col">Action</th>                
                </tr>
            </thead>
            <tbody>
                {% for club in clubs %}
                    <tr>
                        <th scope="row">{{loop.index}}</th>
                        <td>{{club.name}}</td>
                        <td>
                            <a href="{{url_for('club_detail', id=club.id)}}" class="btn btn-outline-success btn-sm">
                                <i class="bi bi-card-checklist"></i>
                            </a>
                        </td>                
                    </tr>
                {% endfor %}
                
                
                
            </tbody>
            </table>
    </div>
{% endblock %}
