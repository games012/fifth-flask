{% extends 'layout.html' %}

{% block title %}
    {{title}}
{% endblock %}


{% block content %}
    <div class="container">
        <h1>{{title}}</h1>
        <hr>
        <form method="post">
            <div class="mb-3">
                <label for="id" class="form-label">Club ID</label>
                <input type="text" class="form-control" id="id" name="id" value="{{club.id}}" readonly>
                
            </div>
            <div class="mb-3">
                <label for="name" class="form-label">Club Name</label>
                <input type="text" class="form-control" id="name" name="name" value="{{club.name}}" readonly>
                
            </div>
            <div class="mb-3">
                <label for="year" class="form-label">Year</label>
                <input type="number" class="form-control" id="year" name="year" value="{{club.year}}" readonly>
                
            </div>
            <div class="mb-3">
                <label for="stadium" class="form-label">Stadium</label>
                <input type="text" class="form-control" id="stadium" name="stadium" value="{{club.stadium}}">
                
            </div>
            <div class="mb-3">
                <label for="image_url" class="form-label">Image URL</label>
                <input type="text" class="form-control" id="image_url" name="image_url" value="{{club.image_url}}" readonly>
                
            </div>
            <hr>
            <button type="submit" class="btn btn-outline-success">
                <i class="bi bi-pencil-square"></i> Update Club
            </button>
            </form>
        </div>
{% endblock %}
